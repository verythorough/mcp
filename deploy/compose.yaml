# VM path: the same image behind Caddy, which terminates TLS and fetches
# certificates automatically.
#
#   MCP_HOSTNAME=mcp.example.com docker compose -f deploy/compose.yaml up -d
#
# Tokens come from a .env file next to this one (chmod 600, never committed).
services:
  fastly-mcp:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Caddy forwards the public hostname in Host; without it: 421.
      MCP_ALLOWED_HOSTS: "${MCP_HOSTNAME}"
      FASTLY_MCP_HTTP_AUTH_TOKEN: "${FASTLY_MCP_HTTP_AUTH_TOKEN:?set in deploy/.env}"
      FASTLY_API_TOKEN: "${FASTLY_API_TOKEN:?set in deploy/.env}"
    expose:
      - "8231"
    # Each concurrent execute call is a ~100MB subprocess on top of the
    # ~90MB base. Leave room for a few.
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - fastly-mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_HOSTNAME: "${MCP_HOSTNAME:?set MCP_HOSTNAME}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
